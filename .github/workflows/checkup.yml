# Daily health check. The app reads two APIs that change without notice, and the failure
# that matters is silent: it keeps working while saying something false. On a FAIL this
# opens (or updates) an issue, which GitHub emails to the repo owner.
name: checkup

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 in São Paulo
  workflow_dispatch:
  push:
    paths: ['classify.js', 'checkup.mjs', '.github/workflows/checkup.yml']

permissions:
  contents: read
  issues: write

jobs:
  checkup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Run checks
        id: check
        run: |
          set -o pipefail
          node checkup.mjs 2>&1 | tee result.txt

      - name: Open an issue if something broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('result.txt', 'utf8');
            const title = 'Checkup falhou: o app pode estar mostrando informação errada';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = [
              'O checkup diário encontrou um problema. Enquanto isso não for corrigido, o app pode estar',
              'dizendo algo errado sobre onde assistir ou quanto custa.',
              '', '```', body.trim(), '```', '', `[Ver execução completa](${run})`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'checkup',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: ['checkup'],
              });
            }

      - name: Close the issue once everything passes again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'checkup',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: 'O checkup voltou a passar. Fechando.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
